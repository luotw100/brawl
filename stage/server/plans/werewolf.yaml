version: 1

audio:
  char_delay: 0.06
  audio_margin: 0.5
  narration_margin: 0.2

host:
  default: append_previous
  placements:
    night_start: lead_in_next
    day_start: lead_in_next
    vote_result: lead_in_next
    reveal: skip

directives:
  ww_game_open:
    content:
      fixed: 4.0
    cues:
      - name: open
        at: 0.0

  ww_deal:
    content:
      fixed: 0.5
      per_item:
        field: seats
        seconds: 0.55
    reveal_paced_by_narration: true

  ww_night_start:
    content:
      fixed: 2.5
    reveal_paced_by_narration: true

  ww_wolf_kill:
    content:
      fixed: 2.0
      per_item:
        field: votes
        seconds: 1.2
    cues:
      - name: assassin-hit
        at:
          fraction: 0.6

  ww_seer_check:
    content:
      fixed: 3.0
      chars: [monologue]

  ww_witch_action:
    content:
      fixed: 3.0
      chars: [monologue]

  ww_death_resolved:
    content:
      fixed: 2.0
      per_item:
        field: deaths
        seconds: 1.5
    reveal_paced_by_narration: true
    cues:
      - name:
          empty_field: deaths
          empty: quest-success
          nonempty: quest-fail
        at: 0.0

  ww_role_reveal:
    content:
      fixed: 2.2

  ww_idiot_reveal:
    content:
      fixed: 3.0

  ww_speech:
    content:
      chars: [text, monologue]
    tail: 3.0
    post_narration_after_main: true
    cues:
      - name: think
        when:
          truthy: monologue
        at: 0.0

  ww_vote_reveal:
    content:
      fixed: 3.0
      per_item:
        field: votes
        seconds: 0.55
    reveal_paced_by_narration: true
    cues:
      - name: stamp
        each:
          field: votes
        at:
          stagger_index:
            field: votes
            fraction: 0.62
      - name:
          none_field: exiled
          none: vote-pass
          present: vote-fail
        at:
          stagger_end:
            field: votes
            fraction: 0.62

  ww_hunter_shot:
    content:
      chars: [text, monologue]
    tail: 5.0
    post_narration_after_main: true
    cues:
      - name:
          none_field: target_no
          none: assassin-miss
          present: assassin-hit
        at: 0.0

  ww_game_over:
    content:
      fixed: 12.0
    cues:
      - name:
          field: winner
          cases:
            good: win-good
            werewolf: win-evil
        at: 0.0

  intermission:
    content:
      fixed: 0.0
