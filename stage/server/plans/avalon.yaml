version: 1

audio:
  char_delay: 0.06
  audio_margin: 0.5
  narration_margin: 0.2

host:
  default: append_previous
  placements:
    propose_intro: lead_in_next
    lady: lead_in_next
    reveal: skip

directives:
  game_open:
    content:
      fixed: 4.0
    cues:
      - name: open
        at: 0.0

  deal:
    content:
      fixed: 0.5
      per_item:
        field: seats
        seconds: 0.75
    reveal_paced_by_narration: true

  speech:
    content:
      chars: [text, monologue]
    tail: 3.0
    post_narration_after_main: true
    cues:
      - name: think
        when:
          truthy: monologue
        at: 0.0

  vote_reveal:
    content:
      fixed: 2.5
      per_item:
        field: votes
        seconds: 0.8
    reveal_paced_by_narration: true
    cues:
      - name: stamp
        each:
          field: votes
        at:
          stagger_index:
            field: votes
            fraction: 0.62
      - name:
          bool_field: approved
          true: vote-pass
          false: vote-fail
        at:
          stagger_end:
            field: votes
            fraction: 0.62

  quest_reveal:
    content:
      fixed: 6.0
    reveal_paced_by_narration: true
    cues:
      - name:
          field: result
          cases:
            success: quest-success
            fail: quest-fail
        at: 0.0

  assassination:
    content:
      chars: [text, monologue]
    tail: 6.0
    post_narration_after_main: true
    cues:
      - name:
          bool_field: hit
          true: assassin-hit
          false: assassin-miss
        at: 0.0

  game_over:
    content:
      fixed: 12.0
    cues:
      - name:
          field: winner
          cases:
            good: win-good
            evil: win-evil
        at: 0.0

  intermission:
    content:
      fixed: 0.0
