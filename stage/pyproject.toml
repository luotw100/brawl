[project]
name = "brawl-stage"
version = "0.1.0"
description = "AI 直播对战的演出层：回放 replay 快照成直播画面（/stage 观众页 + /console 导播台）。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40",  # stage-record：无头 Chromium 录画面（浏览器二进制走 ~/.cache/ms-playwright）
    "rich>=13.7",  # stage-record：节拍进度 + 步骤渲染
    "pillow>=10.0",  # stage-cover：把 title.txt 烧进封面图
]

[project.scripts]
stage-record = "server.record:main_cli"
stage-cover = "server.cover:main_cli"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
faulthandler_timeout = 60

[tool.ruff]
line-length = 120
