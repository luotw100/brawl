# frp 客户端：从本机主动外连中继，把 TLS 字节透传给本栈的 Caddy（中继只见密文）。
# 注意：中继的 443 已被 wangzonghao(laborster) 的 tcp 透传占用，本栈用独立的
# FRP_REMOTE_PORT（如 8443），访问形如 https://stage.example.com:8443。
# 将来要干净 443，需在 frps 开 vhostHTTPSPort 或让两栈共享一个边缘 Caddy——到时再说。
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = 7000

auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

transport.tls.enable = true

[[proxies]]
name = "{{ .Envs.FRP_PROXY_NAME }}"
type = "tcp"
localIP = "caddy"
localPort = 443
remotePort = {{ .Envs.FRP_REMOTE_PORT }}
