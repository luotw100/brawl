[project]
name = "brawl"
version = "0.2.0"
description = "AI 对战游戏：玩法状态机 + 跨玩法运行时 + 演出录屏。当前：阿瓦隆、狼人杀。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27",
    "soundfile>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.40",  # 录屏：无头 Chromium 渲染画面（浏览器二进制走 ~/.cache/ms-playwright）
    "pillow>=10.0",  # 封面：把 title.txt 烧进封面图
]

[project.scripts]
brawl = "brawl.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/tests", "**/tests/**", "**/docs", "**/docs/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/brawl"]

# 阿里云 PyPI 镜像加速安装
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 测试随包自包含（每个子包各自带 tests/），从包根递归自动发现——加玩法/子包无需登记。
testpaths = ["src/brawl"]
# 各玩法的测试文件同名：importlib 导入模式按路径区分，无需 __init__.py
addopts = ["--import-mode=importlib"]
