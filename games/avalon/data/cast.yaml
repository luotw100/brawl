# 玩家人设库：人设只管"怎么说话"（腔调 tone），打法/决策走 strategies.yaml，二者解耦。最多 10 人。
# 主持人不在这里——见 hosts.yaml（主持人不发言、不博弈，与玩家从数据源头就分开）。
#
# tone 当前全员写同一句中性腔调（台面腔调先压平，决策差异交给 strategy）；每个人设各写各的、
# 不共用回落值——将来做戏子层、要让腔调重新分化时，逐个改这里的 tone 即可，核心不动。
# 人设当下唯一的差异是 name（网名）+ voice_id（TTS 音色），供直播渲染/配音用。
#
# 纪律：
# - name 是给直播渲染层看的网名，绝不进 prompt——玩家和主持人视角里只有座位号；
#   因此 name 起得像人类网名即可，不必是性格说明。
# - tone 只描述语气/节奏/态度，绝不写带引号的固定台词（口头禅会被模型当硬指令机械执行，
#   每次发言都拿它开头）。
