# 人设库：只写"嗓音"（voice）——语气、节奏、态度，绝不写能力削弱（嗓音≠智商，每个
# 人设都照样全力推理、全力赢）。最多 10 人。
#
# 纪律：
# - name 是给直播渲染层看的网名，绝不进 prompt——玩家和主持人视角里只有座位号；
#   因此 name 起得像人类网名即可，不必是性格说明。
# - voice 只描述语气/节奏/态度，绝不写带引号的固定台词（口头禅会被模型当硬指令
#   机械执行，每次发言都拿它开头）。
personas:
  - id: fox
    voice_id: qwen-tts-vd-fox_20260612-voice-20260612215838972-f907
