# LLM Provider 池：逻辑模型名 → OpenAI 兼容端点。与人设解耦——
# 哪个座位用哪个模型由运行时 settings.models 决定（见 settings.py / --models）。
# 换厂商/换参数只改这里。api_key_env 指向真实环境变量名（放 .env）。
#
# 池里只放实测能调通、且有 key 的模型——缺 key / 端点不通现在会直接报错（不再静默兜底）。
# DeepSeek 两款是混合思考模型，阿瓦隆本质是推理博弈，故 extra_body 开启 thinking（卧底实测
# 显著提升玩得好不好）：真推理走隐藏的 reasoning 通道，resp.content 只剩干净 JSON，prompt
# 要求公开输出（含 monologue）简短——monologue 是给观众看的内心戏、不是模型的草稿纸。开思考
# 后单次更慢，故 timeout 默认拨到 180s（见 registry.ModelSpec，这里不再逐条覆盖）；不设
# max_tokens（=None，由 timeout 兜底）以免推理长被截断。模型偶发不守格式/空字段由 player 层
# 退避重试兜住（见 LLMPlayer），不靠调参消除。
#
# avatar 指向厂商 logo（data/avatars/<avatar>.png）：录制时按座位把对应 logo 烧进 replay，
# 直播渲染层据此显真实厂商头像；缺省=不带头像，渲染层回退 hash 色块。同厂商多款共用一张。
# display 是对外展示的模型名（不带厂商名——头像已表明厂商）：录制时把"逻辑名→display"映射
# 烧进 meta.model_labels，直播在座位头像下显这行小字。
#
# opencode go（https://opencode.ai/zen/go/v1）是聚合端点，单把 OPENCODE_API_KEY。
# 2026-07-05 复测 /models 共 20 款：qwen3.7-max 已可走 OpenAI 兼容 chat，入池；
# hy3-preview 虽仍出现在 /models，但实际 chat 报 "not supported on the lite model list"，
# 不收录；mimo-v2-pro / mimo-v2-omni 实测 chat 500，继续不收录。最终 17 款入池。
# 名字统一加 oc- 前缀以区分直连 DeepSeek；聚合端透传 extra_body 行为未验证，先不开
# thinking。kimi-k2.7-code 是思考模型（自带 reasoning_content）且 provider 强制
# temperature=1，故单独设 1.0，其余 oc- 款沿用 0.7。
