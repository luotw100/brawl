[project]
name = "brawl-games"
version = "0.1.0"
description = "AI 直播对战的纯游戏逻辑层：玩法状态机 + 跨玩法运行时框架。当前：阿瓦隆。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pydantic-settings>=2.4.0",
    "json-repair>=0.30",
    "httpx>=0.27",
    "soundfile>=0.12",
]

[project.scripts]
brawl = "cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# editable 安装靠 .pth 把 games/ 加进路径，顶层 cli.py 与各包都从源实时生效。
# 不用 force-include 复制 cli.py——那会在 site-packages 留一份副本遮蔽源文件。
packages = ["core", "avalon", "werewolf", "voicelab", "llmview", "slim_audio"]

# 阿里云 PyPI 镜像加速安装
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 测试随玩法自包含：一个文件夹一个玩法、各自带 tests/（不变量 #7）。加玩法在此追加其路径。
testpaths = ["avalon/tests", "core/sr/tests", "slim_audio/tests"]
# 各玩法的测试文件同名（test_nodes.py 等）：importlib 导入模式按路径区分，无需 __init__.py
addopts = ["--import-mode=importlib"]
