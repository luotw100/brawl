# LLM Provider 池：逻辑模型名 → OpenAI 兼容端点。与人设解耦——
# 哪个座位用哪个模型由运行时 settings.models 决定（见 settings.py / --models）。
# 换厂商/换参数只改这里。api_key_env 指向真实环境变量名（放 .env）。
#
# 池里只放实测能调通、且有 key 的模型——缺 key / 端点不通现在会直接报错（不再静默兜底）。
# DeepSeek 两款是混合思考模型，谁是卧底本质是推理博弈，故 extra_body 开启 thinking（实测
# 显著提升玩得好不好）：真推理走隐藏的 reasoning 通道，resp.content 只剩干净 JSON，prompt
# 要求公开输出（含 monologue）简短——monologue 是给观众看的内心戏、不是模型的草稿纸。开思考
# 后单次更慢，timeout 给到 120s；不设 max_tokens（=None，由 timeout 兜底）以免推理长被截断。
#
# Gemini 各款（aixuny 聚合端点 + google 官方 OpenAI 兼容端点）实测 plain 调用就返回干净 JSON、
# 真推理不泄漏进 content（thinking 变体的 reasoning 单独走 reasoning_content，我们只读 content），
# 故无需 extra_body；响应 2~6s，沿用默认 timeout。aixuny 与 google 用各自独立的 key。
models:
  - name: deepseek-v4-flash
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    timeout: 120
    extra_body:
      thinking:
        type: enabled

  - name: deepseek-v4-pro
    base_url: https://api.deepseek.com
    model_id: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    timeout: 120
    extra_body:
      thinking:
        type: enabled

  # Gemini —— aixuny 聚合端点（key 与上面 OpenAI 系不同，单独一把 AIXUNY_GEMINI_API_KEY）
  - name: aixuny-gemini-3-flash-preview
    base_url: https://aixuny.com/v1
    model_id: gemini-3-flash-preview
    api_key_env: AIXUNY_GEMINI_API_KEY
    temperature: 0.7

  - name: aixuny-gemini-3.1-flash-lite-preview
    base_url: https://aixuny.com/v1
    model_id: gemini-3.1-flash-lite-preview
    api_key_env: AIXUNY_GEMINI_API_KEY
    temperature: 0.7

  - name: aixuny-gemini-3.1-pro-preview
    base_url: https://aixuny.com/v1
    model_id: gemini-3.1-pro-preview
    api_key_env: AIXUNY_GEMINI_API_KEY
    temperature: 0.7

  - name: aixuny-gemini-3.1-pro-preview-thinking
    base_url: https://aixuny.com/v1
    model_id: gemini-3.1-pro-preview-thinking
    api_key_env: AIXUNY_GEMINI_API_KEY
    temperature: 0.7

  # Gemini —— google 官方 OpenAI 兼容端点（GOOGLE_API_KEY）
  - name: google-gemini-3.1-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model_id: gemini-3.1-flash-lite
    api_key_env: GOOGLE_API_KEY
    temperature: 0.7

  - name: google-gemini-3.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model_id: gemini-3.5-flash
    api_key_env: GOOGLE_API_KEY
    temperature: 0.7
