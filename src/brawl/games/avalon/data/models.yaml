# Agent 模型池：逻辑模型名 → OpenCode 模型引用 + 展示信息。
# 哪个座位用哪个模型由运行时 settings.models 决定（见 settings.py / --models）。
# 换模型只改这里。
#
# opencode_model 格式：providerID/modelID，例如 opencode-go/deepseek-v4-pro。
# avatar 指向厂商 logo（data/avatars/<avatar>.png），直播渲染用；display 是头像下小字。
models:
- name: ds-v4-pro
  display: DeepSeek V4 Pro
  avatar: deepseek
  opencode_model: deepseek/deepseek-v4-pro
- name: ds-v4-flash
  display: DeepSeek V4 Flash
  avatar: deepseek
  opencode_model: deepseek/deepseek-v4-flash
- name: oc-minimax-m3
  display: MiniMax M3
  avatar: minimax
  opencode_model: opencode-go/minimax-m3
- name: oc-minimax-m2.7
  display: MiniMax M2.7
  avatar: minimax
  opencode_model: opencode-go/minimax-m2.7
- name: oc-kimi-k2.7-code
